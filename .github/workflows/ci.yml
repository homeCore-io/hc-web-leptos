# CI for hc-web-leptos.
#
# Mirrors the plugins' ci.yml shape: same shared rust-ci.yml in
# hc-scripts. fmt + tests run on the host target — the tz module
# (the only test surface today) is platform-independent. Clippy is
# disabled because the codebase carries ~66 stylistic lints
# accumulated pre-CI; cleanup tracked separately as LEPTOS-CLP-1
# in release_0_1_4.md (or its successor). Re-enable
# `run_clippy: true` once those land.
#
# WASM target verification is implicit via the eventual `trunk
# build` deploy step (not yet a CI job). Adding an explicit
# `cargo check --target wasm32-unknown-unknown` matrix is a
# possible follow-up if the host check ever stops catching
# wasm-only regressions.
#
# This repo used to end with a `dispatch-core` job that fired
# homeCore's release on every green develop push, because core
# cloned this repo, compiled it to WASM, and baked the bundle into
# hc-core — so a leptos-only fix would otherwise never reach the dev
# image. Core no longer bundles any UI (hc-web is the UI, in its own
# image), so nothing downstream is waiting on a commit here and the
# cascade had nothing left to trigger. It also passed `-F fast=true`,
# an input core's release no longer declares, so it would now fail on
# every push.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# The default workflow token is read-only, and a called workflow can never hold
# more than its caller. rust-ci.yml opens/closes a tracking issue when develop
# goes red, so without issues:write granted here the whole run fails at startup
# with no jobs and no annotation.
permissions:
  contents: read
  issues: write

jobs:
  ci:
    uses: homeCore-io/hc-scripts/.github/workflows/rust-ci.yml@main
    with:
      rust_version: "1.95"
      run_clippy: false
    secrets: inherit
